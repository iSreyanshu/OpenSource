<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern GraphQL Captcha Client</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        /* Custom tracking for clean captcha input */
        .captcha-letter-spacing { letter-spacing: 0.25em; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4 selection:bg-indigo-500 selection:text-white">

    <div class="bg-slate-800 border border-slate-700/60 p-6 rounded-2xl shadow-2xl w-full max-w-md backdrop-blur-md">
        
        <div class="text-center mb-6">
            <h2 class="text-2xl font-bold bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">
                GraphQL Captcha Test
            </h2>
            <p class="text-xs text-slate-400 mt-1">Modern Async/Await Fetch Implementation</p>
        </div>

        <div class="space-y-4">
            <div id="captcha-card" class="bg-slate-900/50 border border-slate-700 rounded-xl p-4 flex flex-col items-center justify-center min-h-[140px] relative overflow-hidden group">
                
                <div id="captcha-placeholder" class="text-center text-sm text-slate-500 py-6">
                    🔒 Click generate to load security challenge
                </div>

                <div id="captcha-meta" class="hidden absolute top-2 right-2 text-[10px] font-mono text-slate-500 bg-slate-800 px-2 py-0.5 rounded border border-slate-700">
                    <span id="meta-algo"></span> | <span id="meta-expiry"></span>s
                </div>

                <div id="captcha-wrapper" class="hidden bg-white p-3 rounded-lg shadow-inner max-w-full transform transition-all duration-300 hover:scale-[1.02]">
                    </div>
            </div>

            <div class="space-y-3">
                <button id="btn-generate" class="w-full bg-gradient-to-r from-indigo-600 to-indigo-500 hover:from-indigo-500 hover:to-indigo-400 text-white font-medium py-3 px-4 rounded-xl shadow-lg shadow-indigo-900/30 transition-all duration-200 active:scale-[0.98] cursor-pointer flex items-center justify-center gap-2">
                    <span id="gen-icon">🔄</span> <span id="gen-text">Generate Captcha</span>
                </button>

                <form id="verify-form" class="space-y-3 hidden opacity-0 transition-opacity duration-300">
                    <div class="relative">
                        <input type="text" id="captcha-input" autocomplete="off" required placeholder="ENTER CODE" 
                               class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-center font-black uppercase text-xl text-cyan-400 placeholder:text-slate-600 placeholder:font-normal placeholder:text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all captcha-letter-spacing">
                    </div>

                    <button type="submit" id="btn-verify" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 px-4 rounded-xl shadow-lg shadow-emerald-900/20 transition-all duration-200 active:scale-[0.98] cursor-pointer">
                        Verify Code
                    </button>
                </form>
            </div>
        </div>

        <div id="alert-box" class="mt-4 p-4 rounded-xl text-sm font-medium hidden border transition-all duration-300"></div>

        <div class="mt-6 border-t border-slate-700/50 pt-4">
            <button id="btn-logs" class="text-xs text-slate-400 hover:text-indigo-400 transition-colors duration-150 flex items-center gap-1 cursor-pointer font-mono">
                ▶ Show Live Server JSON Logs
            </button>
            <pre id="log-console" class="hidden mt-3 p-3 bg-slate-950 text-cyan-400 text-[11px] rounded-lg overflow-x-auto max-h-48 font-mono border border-slate-800 leading-relaxed"></pre>
        </div>
    </div>

    <script>
        const API_URL = 'https://capssv2.vercel.app/api/graphql';
        
        // App Memory State
        let activeCaptchaState = null;

        // --- CORE API SERVICES (Clean Async/Await Logic) ---

        async function generateCaptchaService() {
            const query = `
                query {
                    generateCaptcha {
                        token
                        encryptedToken
                        image
                        csrfToken
                        sessionId
                        expiresIn
                        algorithm
                    }
                }
            `;

            const response = await fetch(API_URL, {
                method: 'POST',
                credentials: 'include', // Handles HTTP sessions/cookies if needed
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ query })
            });
            
            const result = await response.json();
            if (result.errors) throw new Error(result.errors[0].message);
            return result.data.generateCaptcha;
        }

        async function verifyCaptchaService(token, input, csrfToken) {
            const mutation = `
                mutation VerifyCaptcha($token: String!, $input: String!, $csrfToken: String!) {
                    verifyCaptcha(token: $token, input: $input, csrfToken: $csrfToken) {
                        success
                        message
                        verifiedAt
                    }
                }
            `;

            const response = await fetch(API_URL, {
                method: 'POST',
                credentials: 'include',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    query: mutation,
                    variables: { token, input, csrfToken }
                })
            });

            const result = await response.json();
            if (result.errors) throw new Error(result.errors[0].message);
            return result.data.verifyCaptcha;
        }


        // --- UI & EVENT CONTROLLERS ---

        const dom = {
            btnGen: document.getElementById('btn-generate'),
            genText: document.getElementById('gen-text'),
            genIcon: document.getElementById('gen-icon'),
            placeholder: document.getElementById('captcha-placeholder'),
            wrapper: document.getElementById('captcha-wrapper'),
            meta: document.getElementById('captcha-meta'),
            algo: document.getElementById('meta-algo'),
            expiry: document.getElementById('meta-expiry'),
            form: document.getElementById('verify-form'),
            input: document.getElementById('captcha-input'),
            btnVerify: document.getElementById('btn-verify'),
            alert: document.getElementById('alert-box'),
            btnLogs: document.getElementById('btn-logs'),
            console: document.getElementById('log-console')
        };

        // Utility: Update Live UI Logger
        function writeToConsole(label, data) {
            console.log(`[${label}]`, data);
            const timestamp = new Date().toLocaleTimeString();
            dom.console.textContent = `[${timestamp}] ${label}:\n${JSON.stringify(data, null, 2)}\n\n` + dom.console.textContent;
        }

        // Utility: Display Success/Error Message banners
        function showAlert(type, text) {
            dom.alert.classList.remove('hidden', 'bg-emerald-950/40', 'text-emerald-400', 'border-emerald-800/60', 'bg-rose-950/40', 'text-rose-400', 'border-rose-800/60');
            if (type === 'success') {
                dom.alert.classList.add('bg-emerald-950/40', 'text-emerald-400', 'border-emerald-800/60');
            } else {
                dom.alert.classList.add('bg-rose-950/40', 'text-rose-400', 'border-rose-800/60');
            }
            dom.alert.innerHTML = text;
            dom.alert.classList.remove('hidden');
        }

        // Action 1: Handle Generate Trigger
        dom.btnGen.addEventListener('click', async () => {
            dom.alert.classList.add('hidden');
            dom.btnGen.disabled = true;
            dom.genText.textContent = 'Generating...';
            dom.genIcon.textContent = '⏳';

            try {
                // Call dynamic async function
                const captchaData = await generateCaptchaService();
                activeCaptchaState = captchaData; // Store references securely in state
                writeToConsole("GENERATE CAPTCHA SUCCESS", captchaData);

                // Safe image population
                dom.wrapper.innerHTML = captchaData.image.startsWith('<svg') 
                    ? captchaData.image 
                    : `<img src="${captchaData.image}" alt="Captcha Challenge" class="h-12 object-contain" />`;

                // Update UI layout states
                dom.placeholder.classList.add('hidden');
                dom.wrapper.classList.remove('hidden');
                dom.algo.textContent = captchaData.algorithm;
                dom.expiry.textContent = captchaData.expiresIn;
                dom.meta.classList.remove('hidden');
                
                // Show form smoothly
                dom.form.classList.remove('hidden');
                setTimeout(() => dom.form.classList.remove('opacity-0'), 50);
                
                dom.input.value = '';
                dom.input.focus();

            } catch (err) {
                writeToConsole("GENERATION ERROR", err.message);
                showAlert('error', `<strong>Generation Failed:</strong> ${err.message}`);
            } finally {
                dom.btnGen.disabled = false;
                dom.genText.textContent = 'Regenerate Captcha';
                dom.genIcon.textContent = '🔄';
            }
        });

        // Action 2: Handle Verify Form Submit
        dom.form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const userInput = dom.input.value.trim();
            if (!userInput || !activeCaptchaState) return;

            dom.alert.classList.add('hidden');
            dom.btnVerify.disabled = true;
            dom.btnVerify.textContent = 'Validating...';

            try {
                // Call verification async service mapping state keys
                const verificationResult = await verifyCaptchaService(
                    activeCaptchaState.token,
                    userInput,
                    activeCaptchaState.csrfToken
                );
                
                writeToConsole("VERIFY CAPTCHA RESULT", verificationResult);

                if (verificationResult.success) {
                    showAlert('success', `<strong>🎉 Match Verified!</strong> ${verificationResult.message}`);
                } else {
                    showAlert('error', `<strong>❌ Wrong Code:</strong> ${verificationResult.message || 'Please try again.'}`);
                }

            } catch (err) {
                writeToConsole("VERIFICATION SYSTEM ERROR", err.message);
                showAlert('error', `<strong>System Error:</strong> ${err.message}`);
            } finally {
                dom.btnVerify.disabled = false;
                dom.btnVerify.textContent = 'Verify Code';
            }
        });

        // Toggle logs accordion drawer
        dom.btnLogs.addEventListener('click', () => {
            const isHidden = dom.console.classList.contains('hidden');
            dom.console.classList.toggle('hidden');
            dom.btnLogs.textContent = isHidden ? '▼ Hide Live Server JSON Logs' : '▶ Show Live Server JSON Logs';
        });
    </script>
</body>
</html>
